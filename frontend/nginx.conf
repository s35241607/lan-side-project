server {
    listen 80;
    server_name localhost;

    # Root directory for the static files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to serve the file directly, otherwise fall back to index.html
        # This is important for single-page applications (SPAs) like Vue
        try_files $uri $uri/ /index.html;
    }

    # Optional: You can add a separate location block for API proxying
    # if you weren't handling it in vite.config.js for production.
    # For this setup, we assume the API is on a different domain or
    # the frontend makes direct calls to the backend's exposed port.
    #
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Optional: Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
